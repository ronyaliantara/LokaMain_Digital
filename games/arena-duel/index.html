<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Duel Pintar — Kuis Rebutan 1–4 Pemain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quiz-core.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Definisi grafis bersama (petarung, BOSS, energi) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="gSkin" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fcd9b4"/><stop offset="1" stop-color="#d99a63"/>
      </linearGradient>
      <linearGradient id="gPants" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2b2645"/><stop offset="1" stop-color="#15122a"/>
      </linearGradient>
      <linearGradient id="gShade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".18"/>
      </linearGradient>
      <linearGradient id="gBoss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6d28d9"/><stop offset=".6" stop-color="#3b0764"/><stop offset="1" stop-color="#1e0536"/>
      </linearGradient>
      <radialGradient id="gCore" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff7cc"/><stop offset=".45" stop-color="#fb7185"/><stop offset="1" stop-color="#be123c"/>
      </radialGradient>
      <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fef08a"/><stop offset=".6" stop-color="#f59e0b"/><stop offset="1" stop-color="#b45309"/>
      </linearGradient>

      <!-- Petarung (menghadap kanan) -->
      <symbol id="fighter" viewBox="0 0 120 150">
        <ellipse cx="62" cy="144" rx="38" ry="5" fill="#000" opacity=".45"/>
        <path d="M54 90 L40 118 L30 140 H46 L52 122 L64 98 Z" fill="url(#gPants)" stroke="#0b0716" stroke-width="2" stroke-linejoin="round"/>
        <path d="M64 90 L82 116 L84 140 H100 L95 114 L76 88 Z" fill="url(#gPants)" stroke="#0b0716" stroke-width="2" stroke-linejoin="round"/>
        <path d="M30 140 H46 V143 H28 Z M84 140 H100 L103 143 H84 Z" fill="#0b0716"/>
        <path class="arm-back" d="M52 56 Q38 68 46 80 L56 74" fill="none" stroke="var(--pc)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M52 56 Q38 68 46 80 L56 74" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="58" cy="74" r="6.5" fill="url(#gSkin)" stroke="#0b0716" stroke-width="2"/>
        <path d="M45 52 Q61 43 78 51 L81 93 Q62 99 43 93 Z" fill="var(--pc)" stroke="#0b0716" stroke-width="2" stroke-linejoin="round"/>
        <path d="M45 52 Q61 43 78 51 L81 93 Q62 99 43 93 Z" fill="url(#gShade)"/>
        <path d="M55 48 L62 70 L71 48" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.6" stroke-linejoin="round"/>
        <rect x="43" y="81" width="39" height="7" rx="2" fill="#0f0a1e"/>
        <path d="M73 87 l7 11 M70 87 l1 12" stroke="#0f0a1e" stroke-width="3.2" stroke-linecap="round"/>
        <g class="arm-front">
          <path d="M72 55 L92 70 L100 58" fill="none" stroke="#0b0716" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M72 55 L92 70 L100 58" fill="none" stroke="var(--pc)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="102" cy="55" r="8" fill="url(#gSkin)" stroke="#0b0716" stroke-width="2"/>
          <path d="M98 51 h7 M98 55 h8" stroke="#0b0716" stroke-width="1.2" opacity=".5"/>
        </g>
        <rect x="56" y="40" width="11" height="10" fill="#d99a63"/>
        <circle cx="62" cy="30" r="15" fill="url(#gSkin)" stroke="#0b0716" stroke-width="2"/>
        <path d="M46 29 Q46 12 63 13 Q78 14 78 27 Q69 21 59 22 Q51 23 46 29 Z" fill="#1a1325" stroke="#0b0716" stroke-width="1.5"/>
        <path d="M46 25 Q62 18 78 24 L78 30 Q62 25 46 31 Z" fill="var(--pc)" stroke="#0b0716" stroke-width="1.5"/>
        <path class="tails" d="M47 28 Q36 26 28 34 M47 29 Q38 34 34 45" stroke="var(--pc)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        <path d="M68 31 L75 29.5" stroke="#0b0716" stroke-width="3" stroke-linecap="round"/>
        <path d="M66 26.5 L75 25" stroke="#0b0716" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M70 38 Q73 39 75 37" stroke="#0b0716" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </symbol>

      <!-- BOSS Raja Lupa (menghadap kanan) -->
      <symbol id="boss" viewBox="0 0 160 170">
        <ellipse cx="80" cy="164" rx="58" ry="6" fill="#000" opacity=".5"/>
        <path d="M54 118 L44 160 H66 L72 124 Z M96 118 L104 160 H126 L112 120 Z" fill="#2e1065" stroke="#0b0716" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M36 66 Q14 86 22 116 L36 112 Q34 92 48 80 Z" fill="url(#gBoss)" stroke="#0b0716" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M20 114 l-6 10 M27 116 l-2 11 M34 113 l2 10" stroke="#e9d5ff" stroke-width="4" stroke-linecap="round"/>
        <path d="M40 60 Q80 40 122 60 L128 112 Q80 132 34 112 Z" fill="url(#gBoss)" stroke="#0b0716" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M40 60 Q80 40 122 60 L128 112 Q80 132 34 112 Z" fill="url(#gShade)"/>
        <path d="M52 70 Q80 62 112 70 M50 96 Q80 104 114 96" stroke="#a78bfa" stroke-opacity=".45" stroke-width="2.5" fill="none"/>
        <circle class="core" cx="82" cy="86" r="12" fill="url(#gCore)" stroke="#0b0716" stroke-width="2"/>
        <path d="M118 62 Q146 70 146 92 L150 100" fill="none" stroke="#0b0716" stroke-width="20" stroke-linecap="round"/>
        <path d="M118 62 Q146 70 146 92 L150 100" fill="none" stroke="#5b21b6" stroke-width="15" stroke-linecap="round"/>
        <path d="M143 100 l-2 12 M150 102 l1 12 M157 99 l4 10" stroke="#e9d5ff" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M58 46 Q80 26 104 46 L104 60 Q80 70 56 60 Z" fill="#4c1d95" stroke="#0b0716" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M60 40 Q46 30 44 12 Q56 24 68 30 Z M100 40 Q114 30 116 12 Q104 24 92 30 Z" fill="#e2e8f0" stroke="#0b0716" stroke-width="2" stroke-linejoin="round"/>
        <path d="M66 30 L70 16 L76 26 L80 12 L84 26 L90 16 L94 30 Z" fill="url(#gGold)" stroke="#0b0716" stroke-width="1.8" stroke-linejoin="round"/>
        <path class="eye" d="M70 46 L80 50 L70 52 Z M92 46 L100 44 L98 51 Z" fill="#fde047"/>
        <path d="M68 58 L74 62 L80 57 L86 62 L92 57" stroke="#f5f3ff" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
      </symbol>

      <symbol id="ico-shield" viewBox="0 0 24 24">
        <path d="M12 2 L20 5 V11 Q20 18 12 22 Q4 18 4 11 V5 Z" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 5 V19 M8 9 H16" stroke="#e0f2fe" stroke-width="1.4" opacity=".7"/>
      </symbol>
      <symbol id="ico-swords" viewBox="0 0 64 64">
        <path d="M10 6 L40 36 L36 40 L6 10 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
        <path d="M54 6 L24 36 L28 40 L58 10 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
        <path d="M34 42 L44 32 M30 42 L20 32" stroke="url(#gGold)" stroke-width="6" stroke-linecap="round"/>
        <path d="M40 46 L50 56 M24 46 L14 56" stroke="#7c2d12" stroke-width="6" stroke-linecap="round"/>
        <circle cx="52" cy="58" r="4" fill="url(#gGold)" stroke="#0f172a" stroke-width="1.5"/>
        <circle cx="12" cy="58" r="4" fill="url(#gGold)" stroke="#0f172a" stroke-width="1.5"/>
      </symbol>
    </defs>
  </svg>

  <div class="bg" aria-hidden="true"><div class="bg-glow"></div><div class="bg-floor"></div></div>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64"><use href="#ico-swords"/></svg>
      <div>
        <h1>ARENA DUEL</h1>
        <p>Kuis rebutan • jawaban benar adalah senjatamu</p>
      </div>
    </div>
    <div class="round-info">
      <div><small>RONDE</small><b id="roundNo">0</b></div>
      <div class="sep"></div>
      <div><small>BERTAHAN</small><b id="aliveNo">0</b></div>
    </div>
    <nav class="tools">
      <button class="icon-btn" id="btnSound" title="Suara"></button>
      <button class="icon-btn" data-qc="fullscreen" title="Layar penuh"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      <button class="icon-btn" id="btnRestart" title="Ulang / ubah pemain"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v5h5"/></svg></button>
      <button class="icon-btn wide" data-qc="teacher" title="Mode Guru"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Mode Guru</span></button>
    </nav>
  </header>

  <main class="game">
    <section class="arena" id="arena">
      <div class="fighters" id="fighters"></div>
      <div class="vs" id="vs">VS</div>
    </section>

    <section class="console">
      <div class="qcard" id="qcard">
        <div class="q-top">
          <span class="q-cat" id="qCat">Siap?</span>
          <span class="q-status" id="qStatus"></span>
          <div class="q-timer" id="qTimer">
            <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" class="t-bg"/><circle cx="22" cy="22" r="19" class="t-fg" id="tRing"/></svg>
            <b id="tNum">–</b>
          </div>
        </div>
        <div class="q-body" id="qBody">
          <div class="q-text" id="qText">Tekan <b>MULAI RONDE</b> — semua petarung menjawab bersamaan!</div>
          <div class="q-opts" id="qOpts"></div>
        </div>
        <div class="q-foot" id="qFoot">
          <div class="q-exp" id="qExp"></div>
          <button class="next-btn" id="btnNext">MULAI RONDE <small>Spasi</small></button>
        </div>
        <div class="countdown" id="countdown"></div>
      </div>
      <div class="pads" id="pads"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="questions-default.js"></script>
  <script src="quiz-core.js"></script>
  <script src="game.js"></script>
  <script src="../lokamain-license.js"></script>
</body>
</html>
