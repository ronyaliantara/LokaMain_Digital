<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balap Roket Antariksa — Duel Rebutan 2 Pemain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quiz-core.css">
  <link rel="stylesheet" href="style.css?v=20261110g">
</head>
<body>
  <header class="hud">
    <div class="pcard p1" id="pcard0" style="--pc:#38bdf8">
      <span class="pav" id="pav0">🧑‍🚀</span>
      <div class="pinfo">
        <div class="pname" id="pname0">Pemain 1</div>
        <div class="pips" id="pips0"></div>
        <div class="pkeys" id="pkeys0">W A S D / stik 1</div>
      </div>
      <div class="pitem" id="pitem0" title="Efek aktif"><span>—</span></div>
      <div class="pscore" id="pscore0">0</div>
    </div>

    <div class="center">
      <div class="brand">BALAP ROKET</div>
      <div class="qinfo"><span>SOAL <b id="qNo">0</b></span><span class="timer" id="timer">––</span><span>TARGET <b id="targetNo">5</b></span></div>
      <nav class="tools">
        <button class="tbtn" data-qc="sound" title="Suara"></button>
        <button class="tbtn" data-qc="fullscreen" title="Layar penuh">⛶</button>
        <button class="tbtn" id="btnRules" title="Peraturan">📜</button>
        <button class="tbtn" id="btnSetup" title="Ubah pemain / pengaturan">⚙️</button>
        <button class="tbtn wide" data-qc="teacher" title="Mode Guru">🔐 Guru</button>
      </nav>
    </div>

    <div class="pcard p2" id="pcard1" style="--pc:#f43f5e">
      <span class="pav" id="pav1">👩‍🚀</span>
      <div class="pinfo">
        <div class="pname" id="pname1">Pemain 2</div>
        <div class="pips" id="pips1"></div>
        <div class="pkeys" id="pkeys1">Panah / stik 2</div>
      </div>
      <div class="pitem" id="pitem1" title="Efek aktif"><span>—</span></div>
      <div class="pscore" id="pscore1">0</div>
    </div>
  </header>

  <main class="arena" id="arena">
    <canvas id="cv"></canvas>

    <!-- Papan soal di atas (slow-motion saat baca, tetap tampil saat rebutan) -->
    <div class="qstrip" id="qstrip" hidden>
      <div class="qs-top">
        <span class="qs-slow" id="qsSlow" hidden>🐢 SLOW-MOTION <b id="qsSlowN">10</b></span>
        <span class="qcat" id="qsCat"></span>
        <button class="qs-go" id="qsGo" hidden>▶ Mulai <small>Spasi</small></button>
      </div>
      <p id="qsText"></p>
      <div class="qs-opts" id="qsOpts"></div>
      <div class="qans" id="qsAns" hidden></div>
      <div class="tbar"><i id="tbar"></i></div>
    </div>

    <!-- Analog di layar: Smart TV / IFP layar sentuh -->
    <div class="joy j0" id="joy0" style="--pc:#38bdf8" hidden>
      <div class="joy-base"><span class="ar u">▲</span><span class="ar d">▼</span><span class="ar l">◀</span><span class="ar r">▶</span><div class="joy-knob">P1</div></div>
    </div>
    <div class="joy j1" id="joy1" style="--pc:#f43f5e" hidden>
      <div class="joy-base"><span class="ar u">▲</span><span class="ar d">▼</span><span class="ar l">◀</span><span class="ar r">▶</span><div class="joy-knob">P2</div></div>
    </div>

    <!-- Pesan / hitung mundur -->
    <div class="msg" id="msg" hidden>
      <div class="msg-card">
        <h2 id="msgTitle"></h2>
        <p id="msgSub"></p>
        <button class="msg-btn" id="msgBtn" hidden>▶ MULAI <small>Spasi</small></button>
      </div>
    </div>
  </main>
  <script src="questions-default.js"></script>
  <script src="quiz-core.js?v=20261110"></script>
  <script src="game.js?v=20261110h"></script>
  <script src="../lokamain-license.js?v=20261109"></script>
</body>
</html>
