<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rebut Wilayah — Kuis Perang Pulau 1–4 Regu</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quiz-core.css">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">🗺️</div>
        <div>
          <h1>REBUT <span>WILAYAH</span></h1>
          <p>PERANG PULAU • KUIS REGU</p>
        </div>
      </div>
      <div class="mission">
        <div class="m-item"><small>RONDE</small><b><span id="roundNo">1</span><em id="roundMax">/8</em></b></div>
        <div class="m-item"><small>NETRAL</small><b id="freeNo">0</b></div>
        <div class="m-item"><small>MODE</small><b id="modeLbl">⚔️</b></div>
      </div>
      <nav class="tools">
        <button class="tbtn" id="btnMusic" title="Musik petualangan (M)">🎵<span>Musik</span></button>
        <button class="tbtn" data-qc="sound" title="Suara"></button>
        <button class="tbtn" data-qc="fullscreen" title="Layar penuh">⛶</button>
        <button class="tbtn" id="btnRules" title="Peraturan">📜</button>
        <button class="tbtn" id="btnSetup" title="Pengaturan / ubah regu">⚙️</button>
        <button class="tbtn wide" data-qc="teacher" title="Mode Guru (kelola soal)">🔐<span>Guru</span></button>
      </nav>
    </header>

    <main class="stage" id="stage">
      <canvas id="cv" aria-label="Peta kepulauan"></canvas>
      <div class="hud" id="hud">
        <div class="turn" id="turnChip"></div>
        <div class="hint" id="hint" role="status" aria-live="polite"></div>
      </div>
      <div class="dock" id="dock"></div>
      <section class="rcard" id="rcard" hidden></section>
      <div class="brief" id="brief" hidden></div>
    </main>

    <footer class="teams" id="teams"></footer>
  </div>

  <script src="questions-default.js"></script>
  <script src="quiz-core.js"></script>
  <script src="game.js?v=1"></script>
  <script src="../lokamain-license.js?v=20261109"></script>
</body>
</html>
